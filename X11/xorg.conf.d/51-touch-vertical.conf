Section "InputClass"
        Identifier "ADS7846 Touchscreen"
        MatchProduct "ADS7846 Touchscreen"
        MatchIsTouchscreen "on"
        MatchDevicePath "/dev/input/event*"
        Driver "evdev"
        Option "TransformationMatrix" "0 1 0 1 0 0 0 0 1"
        Option  "Calibration"   "160 3845 168 3871"
EndSection

Section "InputClass"
        Identifier "ADS7846x Touchscreen"
        MatchProduct "ADS7846x Touchscreen"
        MatchIsTouchscreen "on"
        MatchDevicePath "/dev/input/event*"
        Driver "evdev"
        Option "TransformationMatrix" "0 1 0 1 0 0 0 0 1"
        Option  "Calibration"   "160 3845 168 3871"
EndSection
